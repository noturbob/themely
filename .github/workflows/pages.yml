# Publishes site/ to GitHub Pages at noturbob.github.io/themely.
# The film is a release asset (tag "media"), not a committed file, so it never
# reaches anyone who clones or downloads themely. It is fetched here at build time.
name: pages

on:
  push:
    branches: [website]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the film from the media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download media --repo "$GITHUB_REPOSITORY" --pattern themely.mp4 --dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
