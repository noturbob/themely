# Publishes site/ to GitHub Pages. Repo settings: Pages → Source → "GitHub Actions".
# The film lives once in media/ (the README links it too) and is copied in here.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "media/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: cp media/themely.mp4 site/themely.mp4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
